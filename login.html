<!-- =========================================================
     NO-ZOOM GUARD — ล็อกการขยายซูมทุกรูปแบบ
     (พินช์บนมือถือ / ดับเบิลทัป / Ctrl+ล้อเมาส์ / Ctrl+เคีย์บอร์ด)
     การเลื่อนหน้าและการกดปุ่มยังทำงานได้ตามปกติ
     ========================================================= -->
<script>
(function () {
  'use strict';

  var VIEWPORT = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
  var ZOOM_KEYS = ['+', '=', '-', '_', '0', 'Add', 'Subtract', 'Equal'];
  var lastTouchEnd = 0;

  // iOS Safari: กันการซูมด้วยท่ากระทั่ง (pinch-zoom)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
  });

  // กันการซูมด้วย Ctrl/⌘ + เลื่อนล้อเมาส์ (เดสก์ท็อป)
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });

  // กันการซูมด้วยคีย์บอร์ด (Ctrl/⌘ + + / - / 0)
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (ZOOM_KEYS.indexOf(e.key) !== -1) e.preventDefault();
  }, { passive: false });

  // กันการซูมด้วยการแตะสองครั้ง (เบราว์เซอร์รุ่นเก่า) — ไม่กระทบการกดปุ่มซ้ำ
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 320) {
      var t = e.changedTouches && e.changedTouches[0];
      var el = t && t.target;
      var interactive = el && el.closest && el.closest('a,button,input,select,textarea,label,[role="button"]');
      if (!interactive) e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // บังคับระดับการขยาย = 1 เสมอ (กันเบราว์เซอร์ที่พยายามคืนค่าซูมเอง)
  function lockScale() {
    var vp = document.querySelector('meta[name="viewport"]');
    if (!vp) {
      vp = document.createElement('meta');
      vp.setAttribute('name', 'viewport');
      document.head.appendChild(vp);
    }
    if (vp.getAttribute('content') !== VIEWPORT) vp.setAttribute('content', VIEWPORT);
  }
  lockScale();
  window.addEventListener('resize', lockScale);
  window.addEventListener('orientationchange', lockScale);
})();
</script>

<script>
/* =========================================================
   LOGIN PAGE SCRIPT — Firebase Authentication Integration
   ========================================================= */

// ฟังก์ชันเข้าสู่ระบบ
async function handleLogin(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const userRole = document.querySelector('input[name="userRole"]:checked')?.value || 'operator';

  // กำหนดอีเมลสำหรับล็อกอิน: ถ้ากรอกเป็นอีเมลเต็ม ใช้เลย ถ้าไม่ใช่ ให้เติมโดเมน
  const email = username.includes('@') ? username : username + '@router.department.local';

  // แสดงข้อความกำลังดำเนินการ
  const loginBtn = document.getElementById('loginBtn');
  const originalText = loginBtn.textContent;
  loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';
  loginBtn.disabled = true;

  try {
    // ตรวจสอบว่า Firebase Auth พร้อมใช้งานหรือไม่
    const hasFirebaseAuth = typeof firebase !== 'undefined' && firebase.auth && typeof firebase.auth().signInWithEmailAndPassword === 'function';

    // สำหรับแสดผลใน Swal (ทั้ง Firebase และโหมดออฟไลน์)
    const displayName = email;

    if (hasFirebaseAuth) {
      // ใช้ Firebase Authentication ด้วยอีเมล/รหัสผ่าน
      // ต้องตั้งค่า Email/Password provider ใน Firebase Console ก่อน
      const userCredential = await firebase.auth().signInWithEmailAndPassword(
        email,
        password
      );

      const user = userCredential.user;

      // บันทึกบทบาทผู้ใช้ลง LocalStorage
      const roleData = {
        uid: user.uid,
        email: user.email,
        role: userRole,
        loginAt: new Date().toISOString()
      };
      localStorage.setItem('router_user_role', JSON.stringify(roleData));

      // แสดงสถานะสำเร็จ
      Swal.fire({
        icon: 'success',
        title: 'เข้าสู่ระบบสำเร็จ!',
        text: 'ยินดีต้อนรับ ' + (user.email || displayName),
        timer: 1200,
        showConfirmButton: false
      });

      // โอนย้ายไปยังหน้าหลักเลือกโหมด
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    } else {
      // โหมดออฟไลน์ / ทดสอบ: บันทึกข้อมูลในเครื่องโดยตรง
      const localUser = {
        uid: 'local-' + Date.now(),
        email: email,
        role: userRole,
        loginAt: new Date().toISOString()
      };
      localStorage.setItem('router_user_role', JSON.stringify(localUser));

      // แสดงสถานะสำเร็จ
      Swal.fire({
        icon: 'success',
        title: 'เข้าสู่ระบบสำเร็จ (โหมดออฟไลน์)!',
        text: 'ยินดีต้อนรับ ' + localUser.email,
        timer: 1200,
        showConfirmButton: false
      });

      // โอนย้ายไปยังหน้าหลักเลือกโหมด
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }

  } catch (error) {
    console.error('Login failed:', error);

    // แสดงข้อความ错误
    const authError = document.getElementById('authError');
    authError.textContent = error.message || 'เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบข้อมูลให้ถูกต้อง';
    authError.classList.add('visible');

    // คืนค่าปุ่ม
    const loginBtn = document.getElementById('loginBtn');
    loginBtn.textContent = originalText;
    loginBtn.disabled = false;
  }
}

// ฟังก์ชันสำหรับการล็อกอัพ
function handleLogout() {
  firebase.auth().signOut().then(() => {
    localStorage.removeItem('router_user_role');
    Swal.fire({
      icon: 'success',
      title: 'ออกจากระบบสำเร็จ',
      text: 'คุณได้ออกจากระบบเรียบร้อย',
      timer: 1200,
      showConfirmButton: false
    });
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1200);
  }).catch((error) => {
    console.error('Sign out error:', error);
    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
  });
}

// ฟังก์ชันทดสอบข้อมูลผู้ใช้ทดสอบ

        <div><b>หัวหน้างาน</b> - supervisor@router.local / password123</div>
        <div><b>ผู้บันทึก</b> - operator@router.local / password123</div>
        <div><b>ผู้ดูข้อมูล</b> - viewer@router.local / password123</div>
      </div>
    `,
    width: '320px',
    confirmButtonText: 'ปิด'
  });
}

// ฟังก์ชันตรวจสอบสถานะการล็อกอินล่วงหน้า
function checkAuthStatus() {
  const storedUser = localStorage.getItem('router_user_role');
  if (storedUser) {
    const userData = JSON.parse(storedUser);
    // ถ้ามีข้อมูลผู้ใช้แล้ว ให้ไปยังหน้าหลักทันที
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 500);
  }
}

// ตั้งค่า event listeners
document.addEventListener('DOMContentLoaded', function() {
  // ตรวจสอบสถานะก่อนแสดงหน้า
  checkAuthStatus();

  // จัดการการส่งฟอร์มล็อกอิน
  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', handleLogin);
  }

  // ปุ่มเข้าถึงข้อมูลผู้ใช้ทดสอบ
  const testBtn = document.querySelector('a[onclick*="Swal.fire"]');
  if (testBtn) {
    testBtn.addEventListener('click', showTestUsers);
  }
});

// รับการกด Enter ในช่องรหัสผ่านเพื่อส่งฟอร์ม
document.getElementById('password')?.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('loginForm')?.requestSubmit();
  }
});
</script>
